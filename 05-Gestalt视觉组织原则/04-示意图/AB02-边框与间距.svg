<svg xmlns="http://www.w3.org/2000/svg" width="736" height="270" viewBox="0 0 736 270" role="img" aria-labelledby="title description">
<title id="title">边框与间距的分组对照</title>
<desc id="description">四个圆点位置固定。B 版用两个边框分别包住左右两个圆点。</desc>
<rect x="0" y="0" width="736" height="270" rx="14" fill="#fcfbf7"/>
<rect x="24" y="20" width="332" height="208" rx="12" fill="#ffffff" stroke="#d1dadd" stroke-width="2"/>
<rect x="380" y="20" width="332" height="208" rx="12" fill="#ffffff" stroke="#d1dadd" stroke-width="2"/>
<g transform="translate(24 20)">
<circle cx="89" cy="104" r="9" fill="#173b49"/>
<circle cx="151" cy="104" r="9" fill="#173b49"/>
<circle cx="181" cy="104" r="9" fill="#173b49"/>
<circle cx="243" cy="104" r="9" fill="#173b49"/>
</g>
<g transform="translate(380 20)">
<rect x="66" y="76" width="97" height="56" rx="7" fill="none" stroke="#087c70" stroke-width="2"/><rect x="169" y="76" width="97" height="56" rx="7" fill="none" stroke="#087c70" stroke-width="2"/><circle cx="89" cy="104" r="9" fill="#173b49"/>
<circle cx="151" cy="104" r="9" fill="#173b49"/>
<circle cx="181" cy="104" r="9" fill="#173b49"/>
<circle cx="243" cy="104" r="9" fill="#173b49"/>
</g>
<g fill="#173b49" font-size="16" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle"><text x="190" y="253">A</text><text x="546" y="253">B</text></g>
</svg>
