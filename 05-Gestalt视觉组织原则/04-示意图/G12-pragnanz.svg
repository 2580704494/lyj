<rect x="380" y="20" width="332" height="208" rx="12" fill="#ffffff" stroke="#d1dadd" stroke-width="2"/>
<g transform="translate(24 20)">
<rect x="95" y="54" width="96" height="78" rx="0" fill="none" stroke="#173b49" stroke-width="4"/><rect x="141" y="81" width="96" height="78" rx="0" fill="none" stroke="#173b49" stroke-width="4"/>
</g>
<g transform="translate(380 20)">
<rect x="95" y="54" width="96" height="78" rx="0" fill="none" stroke="#087c70" stroke-width="4"/><rect x="141" y="81" width="96" height="78" rx="0" fill="none" stroke="#b44a2c" stroke-width="4"/>
</g>
